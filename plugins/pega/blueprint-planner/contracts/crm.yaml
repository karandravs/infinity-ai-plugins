openapi: 3.1.0
info:
  title: CRM API
  version: 1.0.0
  description: >-
    CRM system of record for the Dispute Resolution Hub. Customer profile lookup and
    case-status writeback.
servers:
  - url: https://crm.example.com/api/v1
security:
  - bearerAuth: []
paths:
  /customers/{customer_id}:
    get:
      summary: Fetch customer profile
      operationId: getCustomer
      parameters:
        - name: customer_id
          in: path
          required: true
          schema:
            type: string
            example: CUST-1042
      responses:
        '200':
          description: Customer profile found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
              examples:
                gold_customer:
                  summary: Anna de Vries - Gold, one prior dispute
                  value:
                    customer_id: CUST-1042
                    full_name: Anna de Vries
                    email: anna.devries@example.com
                    customer_tier: Gold
                    account_status: active
                    lifetime_value: 4820.50
                    prior_disputes_12m: 1
                    open_cases: 0
                    preferred_language: en
                repeat_disputant:
                  summary: Scenario C - high prior dispute count
                  value:
                    customer_id: CUST-1128
                    full_name: Mehmet Kaplan
                    email: mehmet.kaplan@example.com
                    customer_tier: Standard
                    account_status: active
                    lifetime_value: 1840.00
                    prior_disputes_12m: 4
                    open_cases: 1
                    preferred_language: nl
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: CUSTOMER_NOT_FOUND
                message: No customer found for the supplied customer ID.
  /crm-cases/{case_id}:
    patch:
      summary: Update CRM case status
      operationId: updateCrmCase
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            example: CRM-77821
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrmCaseUpdateRequest'
            example:
              dispute_id: DSP-2026-000014
              status: resolved
              disposition: Approved
              refund_amount: 480.00
              resolution_summary: Customer dispute approved; refund reference REF-2026-009821.
              resolved_by: Pega Dispute Resolution Hub
      responses:
        '200':
          description: CRM case updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrmCaseUpdateResponse'
              example:
                case_id: CRM-77821
                status: resolved
                last_modified: '2026-10-10T09:43:15Z'
        '422':
          description: Invalid payload (e.g. refund amount missing)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error_code: INVALID_PAYLOAD
                message: refund_amount is required when status is resolved.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error_code, message]
      properties:
        error_code: { type: string }
        message: { type: string }
    CustomerProfile:
      type: object
      required: [customer_id, full_name, email, customer_tier, account_status]
      properties:
        customer_id: { type: string, example: CUST-1042 }
        full_name: { type: string, example: Anna de Vries }
        email: { type: string, format: email, example: anna.devries@example.com }
        customer_tier: { type: string, enum: [Standard, Silver, Gold, Platinum], example: Gold }
        account_status: { type: string, enum: [active, dormant, closed], example: active }
        lifetime_value: { type: number, format: double, example: 4820.50 }
        prior_disputes_12m: { type: integer, example: 1 }
        open_cases: { type: integer, example: 0 }
        preferred_language: { type: string, example: en }
    CrmCaseUpdateRequest:
      type: object
      required: [status, disposition]
      properties:
        dispute_id: { type: string, example: DSP-2026-000014 }
        status: { type: string, enum: [open, pending, resolved, closed], example: resolved }
        disposition:
          type: string
          enum: [Approved, Partially Approved, Rejected, More Information Required]
          example: Approved
        refund_amount: { type: number, format: double, example: 480.00 }
        resolution_summary: { type: string, example: Customer dispute approved; refund reference REF-2026-009821. }
        resolved_by: { type: string, example: Pega Dispute Resolution Hub }
    CrmCaseUpdateResponse:
      type: object
      required: [case_id, status]
      properties:
        case_id: { type: string, example: CRM-77821 }
        status: { type: string, example: resolved }
        last_modified: { type: string, format: date-time, example: '2026-10-10T09:43:15Z' }
